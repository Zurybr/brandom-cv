<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0e27;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1a3e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="board" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0088aa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#006680;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="chip" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2a2a2a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1a1a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00e5ff;stop-opacity:0" />
      <stop offset="50%" style="stop-color:#00e5ff;stop-opacity:0.6" />
      <stop offset="100%" style="stop-color:#00e5ff;stop-opacity:0" />
    </linearGradient>
    <linearGradient id="led1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ff0040;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#cc0033;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="led2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#00ff88;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00cc66;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="led3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffaa00;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#cc8800;stop-opacity:1" />
    </linearGradient>
    <filter id="glow-filter">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="neon-glow">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="soft-glow">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <radialGradient id="spotlight" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#00e5ff;stop-opacity:0.08" />
      <stop offset="100%" style="stop-color:#00e5ff;stop-opacity:0" />
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1a2a4a" stroke-width="0.5" opacity="0.3" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bg)" />
  <rect width="800" height="500" fill="url(#grid)" />
  <rect width="800" height="500" fill="url(#spotlight)" />

  <!-- Circuit traces background -->
  <g opacity="0.15" stroke="#00e5ff" stroke-width="1" fill="none">
    <path d="M 50 200 H 200 V 300 H 350" />
    <path d="M 100 150 V 250 H 300 V 350" />
    <path d="M 500 100 H 650 V 200 H 750" />
    <path d="M 600 300 V 400 H 700" />
    <path d="M 80 350 H 150 V 420" />
    <path d="M 550 250 H 700 V 350" />
  </g>

  <!-- Arduino Board -->
  <g transform="translate(150, 80)">
    <!-- Board shadow -->
    <rect x="5" y="5" width="500" height="340" rx="12" fill="#000" opacity="0.4" />

    <!-- Main board -->
    <rect x="0" y="0" width="500" height="340" rx="10" fill="url(#board)" stroke="#00aacc" stroke-width="1.5" />

    <!-- Board edge highlight -->
    <rect x="2" y="2" width="496" height="336" rx="9" fill="none" stroke="#00ccee" stroke-width="0.5" opacity="0.3" />

    <!-- USB Connector -->
    <rect x="-25" y="30" width="50" height="80" rx="3" fill="#888" stroke="#aaa" stroke-width="1" />
    <rect x="-22" y="35" width="44" height="70" rx="2" fill="#999" />
    <rect x="-18" y="50" width="36" height="8" rx="1" fill="#666" />
    <text x="-15" y="100" font-family="monospace" font-size="7" fill="#555">USB</text>

    <!-- ATmega328P Chip -->
    <g transform="translate(180, 110)">
      <rect x="0" y="0" width="90" height="100" rx="3" fill="url(#chip)" stroke="#444" stroke-width="0.5" />
      <!-- Chip notch -->
      <circle cx="45" cy="0" r="6" fill="#333" stroke="#444" stroke-width="0.5" />
      <!-- Chip pins left -->
      <g fill="#aa8833">
        <rect x="-8" y="12" width="10" height="3" rx="0.5" />
        <rect x="-8" y="22" width="10" height="3" rx="0.5" />
        <rect x="-8" y="32" width="10" height="3" rx="0.5" />
        <rect x="-8" y="42" width="10" height="3" rx="0.5" />
        <rect x="-8" y="52" width="10" height="3" rx="0.5" />
        <rect x="-8" y="62" width="10" height="3" rx="0.5" />
        <rect x="-8" y="72" width="10" height="3" rx="0.5" />
        <rect x="-8" y="82" width="10" height="3" rx="0.5" />
      </g>
      <!-- Chip pins right -->
      <g fill="#aa8833">
        <rect x="88" y="12" width="10" height="3" rx="0.5" />
        <rect x="88" y="22" width="10" height="3" rx="0.5" />
        <rect x="88" y="32" width="10" height="3" rx="0.5" />
        <rect x="88" y="42" width="10" height="3" rx="0.5" />
        <rect x="88" y="52" width="10" height="3" rx="0.5" />
        <rect x="88" y="62" width="10" height="3" rx="0.5" />
        <rect x="88" y="72" width="10" height="3" rx="0.5" />
        <rect x="88" y="82" width="10" height="3" rx="0.5" />
      </g>
      <!-- Chip label -->
      <text x="45" y="42" text-anchor="middle" font-family="'Courier New', monospace" font-size="8" fill="#ccc" font-weight="bold">ATmega</text>
      <text x="45" y="55" text-anchor="middle" font-family="'Courier New', monospace" font-size="8" fill="#ccc" font-weight="bold">328P</text>
      <text x="45" y="75" text-anchor="middle" font-family="'Courier New', monospace" font-size="6" fill="#888">AU 1834</text>
    </g>

    <!-- Crystal oscillator -->
    <g transform="translate(160, 230)">
      <rect x="0" y="0" width="20" height="10" rx="2" fill="#c0c0c0" stroke="#ddd" stroke-width="0.5" />
      <text x="10" y="22" text-anchor="middle" font-family="monospace" font-size="5" fill="#66aacc">16MHz</text>
    </g>

    <!-- Digital pins header (top) -->
    <g transform="translate(60, 10)">
      <g fill="#333" stroke="#555" stroke-width="0.3">
        <rect x="0" y="0" width="8" height="8" rx="1" /><rect x="12" y="0" width="8" height="8" rx="1" />
        <rect x="24" y="0" width="8" height="8" rx="1" /><rect x="36" y="0" width="8" height="8" rx="1" />
        <rect x="48" y="0" width="8" height="8" rx="1" /><rect x="60" y="0" width="8" height="8" rx="1" />
        <rect x="72" y="0" width="8" height="8" rx="1" /><rect x="84" y="0" width="8" height="8" rx="1" />
        <rect x="96" y="0" width="8" height="8" rx="1" /><rect x="108" y="0" width="8" height="8" rx="1" />
        <rect x="120" y="0" width="8" height="8" rx="1" /><rect x="132" y="0" width="8" height="8" rx="1" />
        <rect x="144" y="0" width="8" height="8" rx="1" /><rect x="156" y="0" width="8" height="8" rx="1" />
        <rect x="168" y="0" width="8" height="8" rx="1" /><rect x="180" y="0" width="8" height="8" rx="1" />
      </g>
      <!-- Pin labels -->
      <g font-family="monospace" font-size="5" fill="#66ddff" text-anchor="middle">
        <text x="4" y="20">0</text><text x="16" y="20">1</text>
        <text x="28" y="20">2</text><text x="40" y="20">3</text>
        <text x="52" y="20">4</text><text x="64" y="20">5</text>
        <text x="76" y="20">6</text><text x="88" y="20">7</text>
        <text x="100" y="20">8</text><text x="112" y="20">9</text>
        <text x="124" y="20">10</text><text x="136" y="20">11</text>
        <text x="148" y="20">12</text><text x="160" y="20">13</text>
        <text x="172" y="20">GND</text><text x="184" y="20">AREF</text>
      </g>
    </g>

    <!-- Analog pins header (bottom) -->
    <g transform="translate(50, 305)">
      <g fill="#333" stroke="#555" stroke-width="0.3">
        <rect x="0" y="0" width="8" height="8" rx="1" /><rect x="12" y="0" width="8" height="8" rx="1" />
        <rect x="24" y="0" width="8" height="8" rx="1" /><rect x="36" y="0" width="8" height="8" rx="1" />
        <rect x="48" y="0" width="8" height="8" rx="1" /><rect x="60" y="0" width="8" height="8" rx="1" />
      </g>
      <g font-family="monospace" font-size="5" fill="#66ddff" text-anchor="middle">
        <text x="4" y="-3">A0</text><text x="16" y="-3">A1</text>
        <text x="28" y="-3">A2</text><text x="40" y="-3">A3</text>
        <text x="52" y="-3">A4</text><text x="64" y="-3">A5</text>
      </g>
    </g>

    <!-- Power pins header (bottom-right) -->
    <g transform="translate(160, 305)">
      <g fill="#333" stroke="#555" stroke-width="0.3">
        <rect x="0" y="0" width="8" height="8" rx="1" /><rect x="12" y="0" width="8" height="8" rx="1" />
        <rect x="24" y="0" width="8" height="8" rx="1" /><rect x="36" y="0" width="8" height="8" rx="1" />
        <rect x="48" y="0" width="8" height="8" rx="1" /><rect x="60" y="0" width="8" height="8" rx="1" />
        <rect x="72" y="0" width="8" height="8" rx="1" /><rect x="84" y="0" width="8" height="8" rx="1" />
      </g>
      <g font-family="monospace" font-size="5" fill="#ffaa44" text-anchor="middle">
        <text x="4" y="-3">RST</text><text x="16" y="-3">3.3V</text>
        <text x="28" y="-3">5V</text><text x="40" y="-3">GND</text>
        <text x="52" y="-3">GND</text><text x="64" y="-3">Vin</text>
      </g>
    </g>

    <!-- Power LED (green, always on) -->
    <g transform="translate(60, 50)" filter="url(#neon-glow)">
      <circle cx="4" cy="4" r="4" fill="url(#led2)" />
      <circle cx="4" cy="4" r="6" fill="#00ff88" opacity="0.2" />
    </g>
    <text x="60" y="68" font-family="monospace" font-size="5" fill="#00cc66">ON</text>

    <!-- TX LED -->
    <g transform="translate(60, 80)" filter="url(#glow-filter)">
      <circle cx="4" cy="4" r="3.5" fill="url(#led1)" />
      <circle cx="4" cy="4" r="5" fill="#ff0040" opacity="0.15" />
    </g>
    <text x="60" y="98" font-family="monospace" font-size="5" fill="#ff4466">TX</text>

    <!-- RX LED -->
    <g transform="translate(90, 80)" filter="url(#glow-filter)">
      <circle cx="4" cy="4" r="3.5" fill="url(#led3)" />
      <circle cx="4" cy="4" r="5" fill="#ffaa00" opacity="0.15" />
    </g>
    <text x="90" y="98" font-family="monospace" font-size="5" fill="#ffaa00">RX</text>

    <!-- LED 13 (built-in) -->
    <g transform="translate(350, 50)" filter="url(#neon-glow)">
      <circle cx="4" cy="4" r="4" fill="#ffcc00" />
      <circle cx="4" cy="4" r="7" fill="#ffcc00" opacity="0.3" />
      <circle cx="4" cy="4" r="10" fill="#ffcc00" opacity="0.1" />
    </g>
    <text x="340" y="68" font-family="monospace" font-size="5" fill="#ffcc00">L</text>

    <!-- Reset button -->
    <g transform="translate(300, 10)">
      <circle cx="8" cy="8" r="8" fill="#444" stroke="#555" stroke-width="1" />
      <circle cx="8" cy="8" r="5" fill="#555" />
      <text x="8" y="25" text-anchor="middle" font-family="monospace" font-size="5" fill="#66aacc">RESET</text>
    </g>

    <!-- Voltage regulator -->
    <g transform="translate(120, 40)">
      <rect x="0" y="0" width="25" height="15" rx="1" fill="#222" stroke="#444" stroke-width="0.5" />
      <rect x="-3" y="5" width="3" height="5" fill="#aa8833" />
      <text x="12" y="10" text-anchor="middle" font-family="monospace" font-size="4" fill="#888">7805</text>
    </g>

    <!-- Ceramic capacitors -->
    <g fill="#c4a035">
      <rect x="150" y="55" width="6" height="4" rx="0.5" />
      <rect x="170" y="55" width="6" height="4" rx="0.5" />
      <rect x="190" y="55" width="6" height="4" rx="0.5" />
    </g>

    <!-- Electrolytic capacitors -->
    <g transform="translate(110, 65)">
      <circle cx="5" cy="5" r="7" fill="#222" stroke="#444" stroke-width="0.5" />
      <line x1="3" y1="3" x2="7" y2="3" stroke="#888" stroke-width="0.5" />
      <text x="5" y="7" text-anchor="middle" font-family="monospace" font-size="3" fill="#888">47u</text>
    </g>

    <!-- Resistors -->
    <g transform="translate(380, 80)">
      <rect x="0" y="0" width="20" height="6" rx="1" fill="#c4a035" />
      <rect x="3" y="0" width="3" height="6" fill="#ff4400" />
      <rect x="7" y="0" width="3" height="6" fill="#aa00ff" />
      <rect x="11" y="0" width="3" height="6" fill="#ff8800" />
    </g>
    <g transform="translate(410, 80)">
      <rect x="0" y="0" width="20" height="6" rx="1" fill="#c4a035" />
      <rect x="3" y="0" width="3" height="6" fill="#ff4400" />
      <rect x="7" y="0" width="3" height="6" fill="#ff4400" />
      <rect x="11" y="0" width="3" height="6" fill="#00aa00" />
    </g>

    <!-- ICSP header -->
    <g transform="translate(360, 250)">
      <g fill="#333" stroke="#555" stroke-width="0.3">
        <rect x="0" y="0" width="6" height="6" rx="1" /><rect x="10" y="0" width="6" height="6" rx="1" />
        <rect x="20" y="0" width="6" height="6" rx="1" />
        <rect x="0" y="10" width="6" height="6" rx="1" /><rect x="10" y="10" width="6" height="6" rx="1" />
        <rect x="20" y="10" width="6" height="6" rx="1" />
      </g>
      <text x="13" y="28" text-anchor="middle" font-family="monospace" font-size="5" fill="#66aacc">ICSP</text>
    </g>

    <!-- Arduino logo text on board -->
    <text x="250" y="290" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="18" fill="#00ccee" opacity="0.5" font-weight="bold">ARDUINO UNO</text>
    <text x="250" y="305" text-anchor="middle" font-family="monospace" font-size="7" fill="#00aacc" opacity="0.3">REV3</text>

    <!-- Circuit traces on board -->
    <g stroke="#005566" stroke-width="0.8" fill="none" opacity="0.4">
      <path d="M 30 80 H 120 V 110 H 180" />
      <path d="M 225 210 V 260 H 160 V 305" />
      <path d="M 360 60 V 100 H 400 V 150" />
      <path d="M 270 210 V 270 H 360" />
      <path d="M 100 305 V 280 H 50 V 200" />
      <path d="M 300 18 V 40 H 350 V 55" />
    </g>
  </g>

  <!-- Floating code lines (right side) -->
  <g transform="translate(670, 100)" font-family="'Courier New', monospace" font-size="9" opacity="0.6">
    <text x="0" y="0" fill="#ff6b9d">void</text>
    <text x="30" y="0" fill="#c792ea">setup</text>
    <text x="63" y="0" fill="#89ddff">() {</text>
    <text x="10" y="15" fill="#c3e88d">pinMode</text>
    <text x="65" y="15" fill="#89ddff">(13,</text>
    <text x="85" y="15" fill="#ff6b9d">OUTPUT</text>
    <text x="130" y="15" fill="#89ddff">);</text>
    <text x="0" y="30" fill="#89ddff">}</text>
    <text x="0" y="50" fill="#ff6b9d">void</text>
    <text x="30" y="50" fill="#c792ea">loop</text>
    <text x="55" y="50" fill="#89ddff">() {</text>
    <text x="10" y="65" fill="#c3e88d">digitalWrite</text>
    <text x="85" y="65" fill="#89ddff">(13,</text>
    <text x="105" y="65" fill="#ff6b9d">HIGH</text>
    <text x="130" y="65" fill="#89ddff">);</text>
    <text x="10" y="80" fill="#c3e88d">delay</text>
    <text x="42" y="80" fill="#89ddff">(</text>
    <text x="47" y="80" fill="#f78c6c">1000</text>
    <text x="72" y="80" fill="#89ddff">);</text>
    <text x="10" y="95" fill="#c3e88d">digitalWrite</text>
    <text x="85" y="95" fill="#89ddff">(13,</text>
    <text x="105" y="95" fill="#ff6b9d">LOW</text>
    <text x="128" y="95" fill="#89ddff">);</text>
    <text x="10" y="110" fill="#c3e88d">delay</text>
    <text x="42" y="110" fill="#89ddff">(</text>
    <text x="47" y="110" fill="#f78c6c">1000</text>
    <text x="72" y="110" fill="#89ddff">);</text>
    <text x="0" y="125" fill="#89ddff">}</text>
  </g>

  <!-- Title badge -->
  <g transform="translate(400, 460)">
    <rect x="-180" y="-18" width="360" height="36" rx="18" fill="#0a0e27" stroke="#00e5ff" stroke-width="1" opacity="0.9" />
    <text x="0" y="5" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#00e5ff" font-weight="bold" letter-spacing="3">VIRTUAL ARDUINO</text>
  </g>

  <!-- Decorative corner dots -->
  <g fill="#00e5ff" opacity="0.2">
    <circle cx="30" cy="30" r="3" />
    <circle cx="770" cy="30" r="3" />
    <circle cx="30" cy="470" r="3" />
    <circle cx="770" cy="470" r="3" />
  </g>

  <!-- Scan line effect -->
  <rect x="0" y="0" width="800" height="500" fill="url(#glow)" opacity="0.05" />
</svg>
