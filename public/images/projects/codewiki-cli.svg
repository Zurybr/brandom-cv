<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0e27;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1a3e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="term" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1c1c2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#14142a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="titlebar" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2a2a3e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1f1f35;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4285f4;stop-opacity:0" />
      <stop offset="50%" style="stop-color:#4285f4;stop-opacity:0.6" />
      <stop offset="100%" style="stop-color:#4285f4;stop-opacity:0" />
    </linearGradient>
    <filter id="neon-glow">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="soft-glow">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <radialGradient id="spotlight" cx="50%" cy="40%" r="55%">
      <stop offset="0%" style="stop-color:#4285f4;stop-opacity:0.10" />
      <stop offset="100%" style="stop-color:#4285f4;stop-opacity:0" />
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1a2a4a" stroke-width="0.5" opacity="0.3" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bg)" />
  <rect width="800" height="500" fill="url(#grid)" />
  <rect width="800" height="500" fill="url(#spotlight)" />

  <!-- Circuit traces background -->
  <g opacity="0.12" stroke="#4285f4" stroke-width="1" fill="none">
    <path d="M 50 80 H 180 V 420" />
    <path d="M 720 60 V 200 H 760" />
    <path d="M 60 440 H 250 V 380" />
    <path d="M 600 440 H 700 V 120" />
  </g>

  <!-- Terminal window -->
  <g transform="translate(110, 70)">
    <!-- Shadow -->
    <rect x="6" y="8" width="580" height="370" rx="12" fill="#000" opacity="0.45" />
    <!-- Body -->
    <rect x="0" y="0" width="580" height="370" rx="10" fill="url(#term)" stroke="#3a3a55" stroke-width="1.5" />
    <!-- Inner highlight -->
    <rect x="2" y="2" width="576" height="366" rx="9" fill="none" stroke="#4a4a66" stroke-width="0.5" opacity="0.4" />

    <!-- Title bar -->
    <rect x="0" y="0" width="580" height="36" rx="10" fill="url(#titlebar)" />
    <rect x="0" y="28" width="580" height="10" fill="url(#titlebar)" />

    <!-- Window dots -->
    <circle cx="22" cy="18" r="6" fill="#ff5f57" />
    <circle cx="42" cy="18" r="6" fill="#febc2e" />
    <circle cx="62" cy="18" r="6" fill="#28c840" />

    <!-- Title -->
    <text x="290" y="23" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#8888aa" font-weight="bold" letter-spacing="1">zurybr@dev: ~/tools/codewiki</text>

    <!-- Terminal content -->
    <g font-family="'Courier New', monospace" font-size="13">
      <!-- Prompt line -->
      <text x="24" y="66" fill="#28c840">➜</text>
      <text x="44" y="66" fill="#89ddff"> ~/tools/codewiki</text>
      <text x="190" y="66" fill="#8888aa">git:(</text>
      <text x="226" y="66" fill="#ff6b9d">main</text>
      <text x="260" y="66" fill="#8888aa">)</text>

      <!-- Command -->
      <text x="24" y="92" fill="#28c840">➜</text>
      <text x="44" y="92" fill="#c3e88d">codewiki</text>
      <text x="120" y="92" fill="#82aaff">repo</text>
      <text x="160" y="92" fill="#ffcb6b">facebook/react</text>

      <!-- Output: heading -->
      <text x="24" y="120" fill="#82aaff">┌────────────────────────────────────┐</text>
      <text x="24" y="138" fill="#82aaff">│</text>
      <text x="40" y="138" fill="#ff9e64" font-weight="bold">CodeWiki · facebook/react</text>
      <text x="540" y="138" fill="#82aaff">│</text>
      <text x="24" y="156" fill="#82aaff">└────────────────────────────────────┘</text>

      <!-- Output: json -->
      <text x="24" y="182" fill="#c792ea">{</text>
      <text x="40" y="200" fill="#ffcb6b">"stars"</text>
      <text x="92" y="200" fill="#c792ea">:</text>
      <text x="104" y="200" fill="#f78c6c">242100</text>
      <text x="152" y="200" fill="#c792ea">,</text>
      <text x="40" y="218" fill="#ffcb6b">"description"</text>
      <text x="132" y="218" fill="#c792ea">:</text>
      <text x="144" y="218" fill="#c3e88d">"The library for web UIs"</text>
      <text x="40" y="236" fill="#ffcb6b">"docs"</text>
      <text x="92" y="236" fill="#c792ea">:</text>
      <text x="104" y="236" fill="#89ddff">"https://codewiki.google"</text>
      <text x="40" y="254" fill="#ffcb6b">"ai"</text>
      <text x="92" y="254" fill="#c792ea">:</text>
      <text x="104" y="254" fill="#c3e88d">"Gemini-generated"</text>
      <text x="24" y="272" fill="#c792ea">}</text>

      <!-- Agent badge -->
      <text x="24" y="306" fill="#28c840">➜</text>
      <text x="44" y="306" fill="#ff6b9d">⚡ Compatible with AI agents</text>

      <!-- Blinking cursor -->
      <text x="24" y="340" fill="#28c840">➜</text>
      <text x="44" y="340" fill="#89ddff"> ~/tools/codewiki</text>
      <rect x="190" y="328" width="9" height="15" fill="#4285f4" filter="url(#soft-glow)">
        <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite" />
      </rect>
    </g>
  </g>

  <!-- Floating tech chips -->
  <g font-family="'Helvetica Neue', Arial, sans-serif" font-size="10" font-weight="bold">
    <g transform="translate(60, 470)" filter="url(#soft-glow)">
      <rect x="0" y="-14" width="64" height="22" rx="11" fill="#0a0e27" stroke="#f7df1e" stroke-width="1" />
      <text x="32" y="1" text-anchor="middle" fill="#f7df1e">Node.js</text>
    </g>
    <g transform="translate(135, 470)" filter="url(#soft-glow)">
      <rect x="0" y="-14" width="76" height="22" rx="11" fill="#0a0e27" stroke="#3776ab" stroke-width="1" />
      <text x="38" y="1" text-anchor="middle" fill="#ffd43b">Python</text>
    </g>
    <g transform="translate(225, 470)" filter="url(#soft-glow)">
      <rect x="0" y="-14" width="82" height="22" rx="11" fill="#0a0e27" stroke="#40b5d4" stroke-width="1" />
      <text x="41" y="1" text-anchor="middle" fill="#40b5d4">Puppeteer</text>
    </g>
    <g transform="translate(325, 470)" filter="url(#soft-glow)">
      <rect x="0" y="-14" width="62" height="22" rx="11" fill="#0a0e27" stroke="#4285f4" stroke-width="1" />
      <text x="31" y="1" text-anchor="middle" fill="#4285f4">CLI</text>
    </g>
    <g transform="translate(405, 470)" filter="url(#soft-glow)">
      <rect x="0" y="-14" width="92" height="22" rx="11" fill="#0a0e27" stroke="#8b5cf6" stroke-width="1" />
      <text x="46" y="1" text-anchor="middle" fill="#8b5cf6">AI Agents</text>
    </g>
  </g>

  <!-- Title badge -->
  <g transform="translate(620, 120)" filter="url(#neon-glow)">
    <rect x="-70" y="-18" width="140" height="36" rx="18" fill="#0a0e27" stroke="#4285f4" stroke-width="1" opacity="0.95" />
    <text x="0" y="5" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#4285f4" font-weight="bold" letter-spacing="2">CODEWIKI</text>
  </g>

  <!-- Decorative corner dots -->
  <g fill="#4285f4" opacity="0.25">
    <circle cx="30" cy="30" r="3" />
    <circle cx="770" cy="30" r="3" />
    <circle cx="30" cy="470" r="3" />
    <circle cx="770" cy="470" r="3" />
  </g>

  <!-- Scan line effect -->
  <rect x="0" y="0" width="800" height="500" fill="url(#glow)" opacity="0.05" />
</svg>
